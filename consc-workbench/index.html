<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>意识项目资料 · 需要访问密码</title>
<style>
:root{--bg:#0b0d12;--card:#161b25;--border:#252c3a;--text:#e6e9ef;--dim:#727b8c;--primary:#818cf8;--red:#ef4444}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',-apple-system,sans-serif}
.card{width:min(400px,92vw);background:var(--card);border:1px solid var(--border);border-radius:14px;padding:34px 30px;text-align:center}
.icon{width:44px;height:44px;border-radius:12px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#7c3aed,#14b8a6);color:#fff;font-size:20px;font-weight:700}
h1{font-size:17px;margin:0 0 6px}p{font-size:13px;color:var(--dim);margin:0 0 18px}
input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:#0e1119;color:var(--text);font-size:15px;text-align:center;outline:none}
input:focus{border-color:var(--primary)}
button{width:100%;margin-top:12px;padding:11px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.err{color:var(--red);font-size:12.5px;min-height:16px;margin-top:10px}
.busy{opacity:.6;pointer-events:none}
html.pre-unlock .card{visibility:hidden}
</style>
<script>/* 有缓存密钥时先藏密码卡防闪烁（load 后自动解锁，见页尾） */
try{if(sessionStorage.getItem("wb-site-key"))document.documentElement.classList.add("pre-unlock");}catch(e){}</script>
</head>

const h2b=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
const b2h=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
async function derive(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:h2b(SALT),iterations:600000,hash:"SHA-256"},km,256);
  return bits;
}
async function tryKey(bits){
  const key=await crypto.subtle.importKey("raw",bits,"AES-GCM",false,["decrypt"]);
  const ct=Uint8Array.from(atob(CT),c=>c.charCodeAt(0));
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:h2b(IV)},key,ct);
  const html=new TextDecoder().decode(pt);
  try{sessionStorage.setItem(SKEY,b2h(bits));}catch(e){}
  document.open();document.write(html);document.close();
}
async function go(){
  const el=document.getElementById("err"),card=document.getElementById("card");
  el.textContent="";card.classList.add("busy");
  try{ await tryKey(await derive(document.getElementById("pw").value)); }
  catch(e){ card.classList.remove("busy"); el.textContent="密码不对，或页面数据受损"; }
}
document.getElementById("go").onclick=go;
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")go();});

// 解析期内 document.open() 是 no-op，会导致壳与正文叠加（审计-15 A1）。
window.addEventListener("load",async()=>{
  try{ const k=sessionStorage.getItem(SKEY); if(k){ await tryKey(h2b(k).buffer); return; } }catch(e){}
  document.documentElement.classList.remove("pre-unlock");
});
