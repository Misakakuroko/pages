const h2b=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
const b2h=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
async function derive(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:h2b(SALT),iterations:600000,hash:"SHA-256"},km,256);
  return bits;
}
async function tryKey(bits){
  const key=await crypto.subtle.importKey("raw",bits,"AES-GCM",false,["decrypt"]);
  const ct=Uint8Array.from(atob(CT),c=>c.charCodeAt(0));
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:h2b(IV)},key,ct);
  const html=new TextDecoder().decode(pt);
  try{sessionStorage.setItem(SKEY,b2h(bits));}catch(e){}
  document.open();document.write(html);document.close();
}
async function go(){
  const el=document.getElementById("err"),card=document.getElementById("card");
  el.textContent="";card.classList.add("busy");
  try{ await tryKey(await derive(document.getElementById("pw").value)); }
  catch(e){ card.classList.remove("busy"); el.textContent="密码不对，或页面数据受损"; }
}
document.getElementById("go").onclick=go;
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
(async()=>{  // 会话内已解锁过 → 直接用缓存密钥解开，无感进入
  try{ const k=sessionStorage.getItem(SKEY); if(k) await tryKey(h2b(k).buffer); }catch(e){}
})();
